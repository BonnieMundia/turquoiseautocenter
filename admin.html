<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Turquoise Auto Centre</title>

  <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css?v=4" />
  <style>
    .admin-wrap { max-width: 960px; margin: 100px auto 60px; padding: 0 20px; }
    .admin-login { max-width: 380px; margin: 140px auto; padding: 0 20px; }
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .admin-tab-btn { padding: 10px 18px; border-radius: 8px; cursor: pointer; }
    .admin-tab-btn.active { background: var(--accent, #00bcd4); color: #fff; }
    .admin-panel { display: none; }
    .admin-panel.active { display: block; }
    .admin-post-row, .admin-enquiry-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 0;
      border-bottom: 1px solid rgba(128,128,128,0.2);
    }
    .admin-post-row img { width: 60px; height: 40px; object-fit: cover; border-radius: 4px; }
    .admin-post-row .grow, .admin-enquiry-row .grow { flex: 1; }
    .admin-form { display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px; }
    .admin-form textarea { min-height: 140px; }
    .admin-stats-table { width: 100%; border-collapse: collapse; }
    .admin-stats-table th, .admin-stats-table td {
      text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(128,128,128,0.2);
    }
    .hidden { display: none; }
  </style>
</head>
<body class="light">

<div id="admin-login" class="admin-login">
  <h2>Admin Sign In</h2>
  <div class="form-group">
    <label for="admin-email">Email</label>
    <input id="admin-email" type="email" autocomplete="username" />
  </div>
  <div class="form-group">
    <label for="admin-password">Password</label>
    <input id="admin-password" type="password" autocomplete="current-password" />
  </div>
  <button id="admin-login-btn" class="btn-primary btn-full-width">Sign In</button>
</div>

<div id="admin-app" class="admin-wrap hidden">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
    <h2>Admin Panel</h2>
    <button id="admin-logout-btn" class="btn-primary">Sign Out</button>
  </div>

  <div class="admin-tabs">
    <button class="admin-tab-btn active" data-tab="posts">Posts</button>
    <button class="admin-tab-btn" data-tab="enquiries">Enquiries</button>
    <button class="admin-tab-btn" data-tab="stats">Stats</button>
  </div>

  <div id="tab-posts" class="admin-panel active">
    <h3 id="post-form-heading">New Post</h3>
    <form id="post-form" class="admin-form">
      <input type="hidden" id="post-id" />
      <div class="form-group">
        <label for="post-title">Title</label>
        <input id="post-title" type="text" required />
      </div>
      <div class="form-group">
        <label for="post-excerpt">Excerpt</label>
        <input id="post-excerpt" type="text" required />
      </div>
      <div class="form-group">
        <label for="post-category">Category</label>
        <input id="post-category" type="text" />
      </div>
      <div class="form-group">
        <label for="post-content">Content (HTML)</label>
        <textarea id="post-content" required></textarea>
      </div>
      <div class="form-group">
        <label for="post-image">Image</label>
        <input id="post-image" type="file" accept="image/*" />
      </div>
      <div style="display:flex; gap:10px;">
        <button type="submit" class="btn-primary">Save Post</button>
        <button type="button" id="post-cancel-btn" class="btn-primary hidden">Cancel Edit</button>
      </div>
    </form>

    <h3>Existing Posts</h3>
    <div id="posts-list"></div>
  </div>

  <div id="tab-enquiries" class="admin-panel">
    <h3>Enquiries</h3>
    <div id="enquiries-list"></div>
  </div>

  <div id="tab-stats" class="admin-panel">
    <h3>Post Stats</h3>
    <table class="admin-stats-table">
      <thead>
        <tr><th>Title</th><th>Views</th><th>Shares</th><th>Published</th></tr>
      </thead>
      <tbody id="stats-list"></tbody>
    </table>
  </div>
</div>

<div id="toast-container" aria-live="polite" aria-atomic="true"></div>

<script src="js/config.js?v=3" defer></script>
<script type="module" src="js/admin.js?v=1"></script>
</body>
</html>
